name: Package addon

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create ZIP with correct folder name
        run: |
          git archive --format=zip --prefix=yAuras/ \
            --output="$RUNNER_TEMP/yAuras.zip" HEAD

      - name: Upload ZIP to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/yAuras.zip"
